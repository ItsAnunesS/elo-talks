name: AppImage release
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libfido2-dev libdbus-1-dev patchelf libfuse2t64 zsync black apparmor bubblewrap xdg-dbus-proxy xvfb xauth libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Rust toolchain
        run: rustup show
      - name: Cache build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-audit
            ~/.cache/elo-talks/bundler
          key: ubuntu24-x64-tools-v1-${{ hashFiles('rust-toolchain.toml', 'scripts/install-build-tools.sh', 'scripts/prepare-bundler.sh') }}
      - name: Cache compiled Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ubuntu24-x64-rust-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'vendor/glib/src/**/*.rs') }}
          restore-keys: ubuntu24-x64-rust-v1-
      - name: Cache Go and npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.npm
            ~/.cache/ms-playwright
          key: ubuntu24-x64-downloads-v1-${{ hashFiles('scripts/prepare-helper.sh', 'updater/go.sum', 'scripts/prepare-updater.sh', 'package-lock.json') }}
          restore-keys: ubuntu24-x64-downloads-v1-
      - name: Install pinned build tools
        run: bash scripts/install-build-tools.sh
      - name: Prepare pinned helper
        run: |
          bash scripts/prepare-helper.sh
          bash scripts/prepare-updater.sh
      - name: Version
        run: python3 scripts/set-version.py "$GITHUB_RUN_NUMBER"
      - name: Checks
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check
          node --check ui/app.js
          python3 scripts/check-commit-messages.py
          black --check scripts tests
          python3 -m unittest discover -s tests -v
      - name: Interface workflow regressions
        run: |
          npx playwright install --with-deps chromium
          bash scripts/test-ui.sh
      - name: Native account and notification regressions
        run: |
          cargo build --locked --example layout_smoke --example notifications_smoke --example launcher_smoke
          dbus-run-session -- timeout 30s target/debug/examples/notifications_smoke
          for scenario in current ready error installing closure; do
            xvfb-run -a dbus-run-session -- timeout 15s target/debug/examples/launcher_smoke "$scenario"
          done
          bash scripts/test-native-layout.sh
      - name: Audit dependencies
        run: |
          # Only this locally corrected advisory is excepted; its source hash is tested above.
          cargo audit --deny unsound --ignore RUSTSEC-2024-0429
      - name: Build AppImage
        run: |
          bash scripts/prepare-bundler.sh
          bash scripts/build-appimage.sh
      - name: Inventory and checksums
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.zsync dist/
          cargo metadata --locked --format-version 1 > dist/rust-dependencies.json
          cp src-tauri/helpers/elo-updater-modules.json dist/updater-dependencies.json
          cp src-tauri/helpers/gocryptfs-modules.json dist/go-dependencies.json
          cp src-tauri/helpers/gocryptfs-LICENSE dist/gocryptfs-LICENSE
          dpkg-query -W > dist/build-system-packages.txt
          python3 scripts/provenance.py
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: appimage-${{ github.sha }}
          path: dist
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: "v2.6.1"
      - name: Sign checksums and build provenance
        run: cosign sign-blob --new-bundle-format --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Verify signature with the bundled updater
        run: |
          image=(dist/*amd64.AppImage)
          chmod +x "${image[0]}"
          "${image[0]}" --appimage-extract usr/bin/elo-updater
          squashfs-root/usr/bin/elo-updater verify dist
      - name: Publish without overwriting existing releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: python3 scripts/release.py
