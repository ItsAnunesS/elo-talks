name: Checks
on:
  pull_request:
  push:
    branches: ["codex/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
      release_run_number:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libx11-dev libxdo-dev libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0 libdrm2 libayatana-appindicator3-dev librsvg2-dev libssl-dev libfido2-dev libdbus-1-dev file patchelf libfuse2t64 fuse3 zsync black apparmor bubblewrap xdg-dbus-proxy xvfb xauth xdotool libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Rust toolchain
        run: rustup show
      - name: Cache build tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-audit
            ~/.cache/elo-talks/bundler
          key: ubuntu24-x64-tools-v1-${{ hashFiles('rust-toolchain.toml', 'scripts/install-build-tools.sh', 'scripts/prepare-bundler.sh') }}
      - name: Cache compiled Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ubuntu24-x64-rust-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'vendor/**/*.rs') }}
          restore-keys: ubuntu24-x64-rust-v1-
      - name: Cache Go and npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.npm
            ~/.cache/ms-playwright
          key: ubuntu24-x64-downloads-v1-${{ hashFiles('scripts/prepare-helper.sh', 'updater/go.sum', 'scripts/prepare-updater.sh', 'package-lock.json') }}
          restore-keys: ubuntu24-x64-downloads-v1-
      - name: Install pinned build tools
        run: bash scripts/install-build-tools.sh
      - name: Cache pinned CEF distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cef-runtime
            target/cef-minimal.tar.bz2
          key: linux-x64-cef-${{ hashFiles('scripts/prepare-cef.py') }}
      - name: Prepare pinned CEF
        run: |
          cef_path="$(python3 scripts/prepare-cef.py)"
          echo "CEF_PATH=$cef_path" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$cef_path" >> "$GITHUB_ENV"
      - name: Prepare pinned helper
        run: |
          bash scripts/prepare-helper.sh
          bash scripts/prepare-updater.sh
      - name: Release version
        if: inputs.release_build
        env:
          RELEASE_RUN_NUMBER: ${{ inputs.release_run_number }}
        run: python3 scripts/set-version.py "$RELEASE_RUN_NUMBER"
      - name: Build native regression fixtures
        run: cargo build --locked --example layout_smoke --example notifications_smoke --example launcher_smoke --example clipboard_smoke --example cef_notification_smoke --example shell_smoke --example media_permission_smoke
      - name: Native clipboard regressions
        run: bash scripts/test-native-layout.sh clipboard_smoke
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust unit regressions
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Frontend tooling and formatting
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check
          node --check ui/app.js
      - name: Conventional Commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR_HEAD_SHA" ]]; then
            python3 scripts/check-commit-messages.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          else
            python3 scripts/check-commit-messages.py
          fi
      - name: Python regressions and formatting
        run: |
          black --check scripts tests
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Interface workflow regressions
        run: |
          npx playwright install --with-deps chromium
          bash scripts/test-ui.sh
      - name: Native notification regressions
        run: dbus-run-session -- timeout 30s target/debug/examples/notifications_smoke
      - name: Native launcher regressions
        run: |
          for scenario in current ready error installing closure cooldown close; do
            xvfb-run -a dbus-run-session -- timeout 15s target/debug/examples/launcher_smoke "$scenario"
          done
      - name: Native CEF regressions
        run: |
          bash scripts/test-native-layout.sh layout_smoke
          bash scripts/test-native-layout.sh cef_notification_smoke
          bash scripts/test-native-layout.sh shell_smoke
          bash scripts/test-native-layout.sh media_permission_smoke
      - name: Audit dependencies
        run: |
          # Only this locally corrected advisory is excepted; its source hash is tested above.
          cargo audit --deny unsound --ignore RUSTSEC-2024-0429
      - name: Build AppImage
        run: |
          bash scripts/prepare-bundler.sh
          bash scripts/build-appimage.sh
      - name: Packaged production shell
        run: |
          for image in target/release/bundle/appimage/*.AppImage; do
            xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 scripts/test-packaged-shell.py "$image"
          done
      - name: Inventory and checksums
        if: inputs.release_build
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.zsync dist/
          cargo metadata --locked --format-version 1 > dist/rust-dependencies.json
          cp src-tauri/helpers/elo-updater-modules.json dist/updater-dependencies.json
          cp src-tauri/helpers/gocryptfs-modules.json dist/go-dependencies.json
          cp src-tauri/helpers/gocryptfs-LICENSE dist/gocryptfs-LICENSE
          cp "$CEF_PATH/archive.json" dist/cef-distribution.json
          cp "$CEF_PATH/LICENSE.txt" dist/cef-LICENSE.txt
          dpkg-query -W > dist/build-system-packages.txt
          python3 scripts/provenance.py
          (cd dist && sha256sum * > SHA256SUMS)
      - if: inputs.release_build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: tests/test-results/native/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Validation summary
        if: always()
        env:
          VALIDATION_SHA: ${{ github.sha }}
          PACKAGED: ${{ inputs.release_build }}
        run: |
          echo "Validated source: $VALIDATION_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Release artifact export requested: $PACKAGED" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native fixture failures include stage/scale annotations and attached synthetic logs.' >> "$GITHUB_STEP_SUMMARY"
