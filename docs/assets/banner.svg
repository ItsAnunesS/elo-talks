<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Elo Talks - Separate accounts. One private space.</title>
  <desc id="banner-desc">The Elo Talks interlocking links and wordmark on a dark background with soft violet accents.</desc>
  <defs>
    <clipPath id="surface-clip"><path d="M0 0h1280v340a20 20 0 0 1-20 20H20a20 20 0 0 1-20-20Z"/></clipPath>
  </defs>
