<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Elo Talks — Separate accounts. One private space.</title>
  <desc id="banner-desc">Elo Talks branding beside an illustration of WhatsApp channels organized into personal and work spaces.</desc>
  <defs>
    <linearGradient id="surface" x2="1280" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#181720"/><stop offset="1" stop-color="#101116"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9D87E8" stop-opacity=".14"/><stop offset="1" stop-color="#9D87E8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#surface)"/>
  <ellipse cx="1000" cy="190" rx="350" ry="280" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="399" rx="23.5" stroke="#35313F"/>
  <g transform="translate(58 52) scale(.1171875)">
  <defs>
    <linearGradient id="base" x1="70" y1="25" x2="433" y2="495" gradientUnits="userSpaceOnUse"><stop stop-color="#343148"/><stop offset=".52" stop-color="#1C1B2A"/><stop offset="1" stop-color="#10111B"/></linearGradient>
    <linearGradient id="edge" x1="80" y1="10" x2="420" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#79718F" stop-opacity=".7"/><stop offset=".48" stop-color="#393546" stop-opacity=".35"/><stop offset="1" stop-color="#615772" stop-opacity=".5"/></linearGradient>
    <linearGradient id="silver" x1="225" y1="130" x2="374" y2="287" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9FF"/><stop offset="1" stop-color="#C6B9F3"/></linearGradient>
    <linearGradient id="violet" x1="137" y1="240" x2="286" y2="388" gradientUnits="userSpaceOnUse"><stop stop-color="#C5B2FF"/><stop offset="1" stop-color="#8D6FE5"/></linearGradient>
  </defs>
  <rect x="9" y="9" width="494" height="494" rx="119" fill="url(#base)"/>
  <rect x="10.5" y="10.5" width="491" height="491" rx="117.5" stroke="url(#edge)" stroke-width="3"/>
  <!-- Two open, interlocking links: a connection with room to breathe. -->
  <g stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 272a80 80 0 0 0 120.64 8.64l48-48a80 80 0 0 0-113.12-113.12L252 147" stroke="url(#silver)"/>
    <path d="M288 240a80 80 0 0 0-120.64-8.64l-48 48a80 80 0 0 0 113.12 113.12L260 365" stroke="url(#violet)"/>
  </g>
</g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="132" y="91" font-size="30" letter-spacing="-1" fill="#F0EDF7" font-weight="600">elo<tspan fill="#B7B0C8" font-weight="400">talks</tspan></text>
    <text x="60" y="187" font-size="48" letter-spacing="-1.8" fill="#F3F0F8" font-weight="600">Separate accounts.</text>
    <text x="60" y="245" font-size="48" letter-spacing="-1.8" fill="#C3B1F5" font-weight="600">One private space.</text>
    <text x="62" y="290" font-size="18" fill="#ABA6B8">WhatsApp workspaces for your Linux desktop.</text>
    <path d="M62 337h30" stroke="#B9A5F2" stroke-width="2"/>
    <text x="104" y="342" font-size="12" letter-spacing="2" fill="#AAA3BA">LOCAL VAULT · NO TELEMETRY</text>
    <rect x="748" y="64" width="470" height="276" rx="18" fill="#18191F" stroke="#3B3748"/>
    <path d="M818 65v274" stroke="#32303C"/>
    <rect x="762" y="86" width="42" height="42" rx="14" fill="#C0ACF6"/>
    <text x="783" y="112" text-anchor="middle" font-size="16" fill="#272033" font-weight="600">P</text>
    <rect x="762" y="140" width="42" height="42" rx="14" fill="#2D2B38"/>
    <text x="783" y="166" text-anchor="middle" font-size="16" fill="#C3BDD0">W</text>
    <rect x="748" y="97" width="3" height="20" rx="1.5" fill="#C0ACF6"/>
    <text x="844" y="108" font-size="20" fill="#F0EDF7" font-weight="600">Personal</text>
    <text x="844" y="138" font-size="12" fill="#9891A6" letter-spacing="1.5">YOUR CHANNELS</text>
    <rect x="836" y="158" width="362" height="60" rx="12" fill="#302A40"/>
    <circle cx="863" cy="188" r="5" fill="#7DD9B4"/>
    <text x="882" y="194" font-size="16" fill="#ECE7F4">WhatsApp · Personal</text>
    <circle cx="863" cy="249" r="5" fill="#7DD9B4"/>
    <text x="882" y="255" font-size="16" fill="#B8B2C5">WhatsApp · Work</text>
    <path d="M838 281h360" stroke="#302D3B"/>
    <text x="844" y="312" font-size="12" fill="#AAA3B7">Separate sessions. An encrypted local vault.</text>
  </g>
</svg>
