[package]
name = "elo-talks"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Communication accounts in a local vault"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", default-features = false , features = [] }
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "=3.0.0-alpha.6", default-features = false, features = ["tray-icon", "unstable", "gtk4"] }
tauri-runtime = "=3.0.0-alpha.5"
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = ["unstable"] }
gtk = { package = "gtk4", version = "=0.11.4", features = ["v4_14"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
libc = "0.2"
fs2 = "0.4"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
dbus = "0.9"
signal-hook = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
