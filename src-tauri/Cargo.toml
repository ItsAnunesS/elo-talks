[package]
name = "elo-talks"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Communication accounts in a local vault"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
javascriptcore-rs = "=1.1.2"
webkit2gtk = { version = "2", features = ["v2_40"] }
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
libc = "0.2"
fs2 = "0.4"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
dbus = "0.9"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
